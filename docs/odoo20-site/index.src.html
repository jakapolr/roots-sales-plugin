<style>
/* Layout: sticky top bar + left area rail (stacks to chips on phones) + one reading column.
   Plum = Odoo's own brand hue as the accent; teal = functional lens; indigo = technical lens. */
:root{
  --bg:#f6f5f7; --surface:#ffffff; --sunk:#efedf1; --ink:#1c1620; --muted:#665d6b; --line:#e2dde5;
  --accent:#714b67; --accent-ink:#ffffff; --accent-soft:#f1e9ef;
  --func:#0b7a62; --func-soft:#e3f3ee; --tech:#3a4fb8; --tech-soft:#e7eafb;
  --new:#1f7a3d; --new-soft:#e2f2e6; --chg:#9a6200; --chg-soft:#fbf0dc; --rem:#b3261e; --rem-soft:#fbe5e3;
  --f-display:"Bricolage Grotesque","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141116; --surface:#1d1920; --sunk:#252029; --ink:#ede8ef; --muted:#a79dac; --line:#352e3a;
  --accent:#c99bbd; --accent-ink:#1c1620; --accent-soft:#33252f;
  --func:#4fc7a6; --func-soft:#16322b; --tech:#9aa8f5; --tech-soft:#222846;
  --new:#6fcf8c; --new-soft:#173222; --chg:#e8b45a; --chg-soft:#35290f; --rem:#f08b83; --rem-soft:#3a1c1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141116; --surface:#1d1920; --sunk:#252029; --ink:#ede8ef; --muted:#a79dac; --line:#352e3a;
  --accent:#c99bbd; --accent-ink:#1c1620; --accent-soft:#33252f;
  --func:#4fc7a6; --func-soft:#16322b; --tech:#9aa8f5; --tech-soft:#222846;
  --new:#6fcf8c; --new-soft:#173222; --chg:#e8b45a; --chg-soft:#35290f; --rem:#f08b83; --rem-soft:#3a1c1a;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6}
:lang(th) body, body.th{line-height:1.75}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--sunk);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-size:16px;font-weight:700;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2;white-space:nowrap}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.seg.lens button[data-v="functional"][aria-pressed="true"]{color:var(--func)}
.seg.lens button[data-v="technical"][aria-pressed="true"]{color:var(--tech)}

/* shell */
.shell{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
.rail h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:14px}
.rail a .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail a .c{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail a:hover{background:var(--sunk)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{min-width:0}
@media (max-width:900px){
  .bar{position:static}
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px;gap:6px}
  .rail h4{display:none}
  .rail a{display:flex;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .rail a .c{display:none}
  .tools{margin-left:0}
}

/* type & blocks */
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.page-h{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.page-h h1{font-size:clamp(28px,4vw,40px);font-weight:700}
.lead{font-size:17px;color:var(--muted);max-width:68ch;margin:0}
section{margin-top:34px}
section>h2{font-size:21px;font-weight:700;margin-bottom:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
section>h2 .sub{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat.new b{color:var(--new)} .stat.rem b{color:var(--rem)}

/* items */
.items{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-left:3px solid var(--line)}
.item.functional{border-left-color:var(--func)} .item.technical{border-left-color:var(--tech)} .item.both{border-left-color:var(--accent)}
.item h3{font-family:var(--f-body);font-size:15.5px;font-weight:600;margin-bottom:4px;text-wrap:pretty}
.item p{margin:0;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.functional{background:var(--func-soft);color:var(--func)} .chip.technical{background:var(--tech-soft);color:var(--tech)} .chip.both{background:var(--accent-soft);color:var(--accent)}
.chip.NEW,.chip.new{background:var(--new-soft);color:var(--new)}
.chip.REMOVED,.chip.removed{background:var(--rem-soft);color:var(--rem)}
.chip.CHANGED-MAJOR,.chip.changed,.chip.CHANGED{background:var(--chg-soft);color:var(--chg)}
.chip.high{background:var(--rem-soft);color:var(--rem)} .chip.medium{background:var(--chg-soft);color:var(--chg)}
.ref{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}

/* area cards */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.acard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.acard:hover{border-color:var(--accent);transform:translateY(-1px)}
.acard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.acard .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.acard h3{font-size:17px;font-weight:700}
.acard p{color:var(--muted);font-size:13.5px;margin:0;flex:1}
.counts{display:flex;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts .cn{color:var(--new)} .counts .cr{color:var(--rem)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.mono,.modname{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* lens banner */
.lensnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--sunk);font-size:13.5px;color:var(--muted)}
.lensnote b{color:var(--ink)}

/* module explorer */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type=search],.filters select{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.filters input[type=search]{flex:1 1 240px}
.filters label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.modrow{cursor:pointer}
.modrow:hover td{background:var(--sunk)}
.moddetail td{background:var(--sunk)}
.moddetail .deps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.moddetail .deps button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 7px;font-family:var(--f-mono);font-size:12px}
.more{margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:default}

/* report */
.report details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.report summary{cursor:pointer;padding:12px 16px;font-weight:600;font-family:var(--f-display);font-size:16px;display:flex;gap:10px;align-items:center;list-style:none}
.report summary::-webkit-details-marker{display:none}
.report summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.report details[open] summary::before{transform:rotate(45deg)}
.report .body{padding:4px 18px 16px;border-top:1px solid var(--line);min-width:0}
.report .body table{font-size:13px}
.report .body .tbl-wrap{margin:10px 0}
.report .body h3{font-size:16px;margin:18px 0 8px}
.report .body ul,.report .body ol{padding-left:22px}
.report .body li{margin:3px 0}
.report .body pre{background:var(--sunk);padding:10px;border-radius:8px;overflow-x:auto;font-size:12.5px}
.report .body blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.tr-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 6px;font-size:13px;color:var(--muted)}
.tr-out{border:1px dashed var(--accent);border-radius:8px;padding:6px 14px;margin:6px 0 12px;background:var(--accent-soft)}

/* downloads */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.dlc{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.dlc .ext{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;align-self:flex-start}
.dlc h3{font-family:var(--f-body);font-size:15px;font-weight:600}
.dlc p{color:var(--muted);font-size:13.5px;margin:0;flex:1}
.dlc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.dlc .size{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status{font-size:12.5px;color:var(--muted);min-height:1em}
.callout{padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.callout b{color:var(--accent)}
ol.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}
footer{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const L = o => o==null ? '' : (typeof o==='string' ? o : (o[lang] || o.en || ''));

const statusLabel = s => lang==='th' ? (STATUS_TH[s]||s) : s.replace('CHANGED-MAJOR','CHANGED · MAJOR');

const fmtSize = n => n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';

function route(){ const h=(location.hash||'#home').slice(1); return h||'home'; }

}

function lensNote(){ return `<div class="lensnote">${t('lensnote_'+lens)}</div>`; }
function itemHTML(it, aud){
  const refs=(it.refs||[]).slice(0,3).map(r=>`<span class="ref">${esc(r)}</span>`).join(' ');
  const kind = it.kind ? `<span class="chip ${esc(it.kind)}">${lang==='th'?(KIND_TH[it.kind]||it.kind):esc(it.kind)}</span>`:'';

  return `<article class="item ${aud}"><h3>${rich(L(it.title))}</h3><p>${rich(L(it.body))}</p><div class="meta"><span class="chip ${aud}">${aud==='technical'?t('lens_t'):aud==='functional'?t('lens_f'):t('lens_a')}</span>${kind}${imp}${refs}</div></article>`;
}

/* report sections, loaded on demand, translated on demand */
const reportCache = {}; const trCache = {};
function reportShell(id){
  return `<section class="report" id="report"><h2>${t('full')} <span class="sub">${t('full_sub')}</span></h2>
   <div class="tr-bar"><button class="btn" data-act="openall">${t('open_all')}</button><button class="btn" data-act="closeall">${t('close_all')}</button>${capsSettled && !sample?`<span>${t('tr_off')}</span>`:''}</div>
   <div id="rep-body" data-id="${id}"><p class="muted">${t('loading')}</p></div></section>`;
}
async function loadReport(id){
  const host=document.getElementById('rep-body'); if(!host || host.dataset.id!==id) return;
  try{
    if(!reportCache[id]){ const r=await fetch('reports/'+id+'.json'); if(!r.ok) throw new Error(r.status); reportCache[id]=await r.json(); }
    if(!document.getElementById('rep-body') || host.dataset.id!==id) return;
    host.innerHTML = reportCache[id].map((s,i)=>{
      const key=id+':'+i, tr=trCache[key] || store.get('o20.tr.'+key,null);
      if(tr) trCache[key]=tr;
      const trBtn = sample ? `<div class="tr-bar"><button class="btn ${lang==='th'?'primary':''}" data-act="tr" data-key="${key}">${tr?t('tr_again'):t('tr_btn')}</button><span class="status" id="st-${CSS.escape(key)}"></span></div>`:'';
      return `<details data-key="${key}"><summary>${esc(s.h)}</summary><div class="body">${trBtn}<div class="tr-slot" id="tr-${i}">${tr?`<div class="tr-out"><p class="muted" style="font-size:12.5px">${t('tr_done')}</p>${sanitize(tr)}</div>`:''}</div>${wrapTables(s.html)}</div></details>`;
    }).join('');
  }catch(e){ host.innerHTML=`<p class="muted">${esc(t('dl_fail'))} (${esc(e.message)})</p>`; }
}
const wrapTables = h => h.replace(/<table>/g,'<div class="tbl-wrap"><table>').replace(/<\/table>/g,'</table></div>');
function sanitize(html){
  const doc=new DOMParser().parseFromString('<div>'+html.replace(/^```(?:html)?\s*|\s*```\s*$/g,'')+'</div>','text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,img').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{const nm=a.name.toLowerCase(); if(nm.startsWith('on')||nm==='style'||((nm==='href'||nm==='src')&&/^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);});});
  return wrapTables(doc.body.firstChild.innerHTML);
}
let trCtl=null;
async function translate(btn){
  const key=btn.dataset.key, [id,i]=key.split(':'), sec=reportCache[id]?.[+i]; if(!sec||!sample) return;
  const slot=document.getElementById('tr-'+i), st=document.getElementById('st-'+CSS.escape(key));
  trCtl?.abort(); trCtl=new AbortController(); const ctl=trCtl;
  btn.disabled=true; st.innerHTML=`${t('tr_busy')} <button class="btn" data-act="stop">${t('tr_stop')}</button>`;
  const prompt=`Translate this HTML fragment from English into Thai for Thai Odoo ERP consultants and developers at an Odoo partner in Bangkok.

/* AI pack: assembled in the browser (store-only ZIP) from the published Markdown files */
const ZIP_LAYOUT = [
 ['docs/README-AI.md','README-AI.md'],['docs/llms.txt','llms.txt'],['docs/STUDY-PAPER.md','STUDY-PAPER.md'],['docs/01-module-catalog.md','01-module-catalog.md'],
 ['docs/module_catalog_19_vs_20.csv','module_catalog_19_vs_20.csv'],['docs/odoo20-ce-knowledge-combined.md','odoo20-ce-knowledge-combined.md'],
 ['docs/odoo20-ce-expert-SKILL.md','skill/odoo20-ce-expert/SKILL.md'],
 ...Object.values(AREA_FILE).map(f=>['docs/'+f,'areas/'+f])];
const CRC_T = (()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32 = b => {let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
async function buildZip(){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const [src,name] of ZIP_LAYOUT){
    const r=await fetch(src); if(!r.ok) throw {code:'http_'+r.status};
    const data=new Uint8Array(await r.arrayBuffer()), fn=enc.encode('odoo20-ce-kb/'+name), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x5D43,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,fn.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),fn,data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x5D43,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,fn.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),fn); off+=30+fn.length+data.length;
  }
  const csz=central.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,ZIP_LAYOUT.length,true);e.setUint16(10,ZIP_LAYOUT.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'});
}
const SIZES = /*__SIZES__*/{};
function viewDownloads(){
  const off = capsSettled && !downloads;
  const groups=['grp_read','grp_ai','grp_data','grp_areas'];
  return `<div class="page-h"><span class="eyebrow">${FILES.length} files</span><h1>${t('dl_title')}</h1><p class="lead">${t('dl_lead')}</p></div>

  ${groups.map(g=>`<section><h2>${t(g)}</h2><div class="dl">${FILES.filter(x=>x.g===g).map(x=>{const [n,dsc]=x[lang]||x.en; const ext=x.f.split('.').pop().toUpperCase(); return `<div class="dlc"><span class="ext">${ext}</span><h3>${esc(n)}</h3><p>${esc(dsc)}</p><div class="row"><span class="size">${esc(x.f)}${x.p==='@zip'?' · '+fmtSize(ZIP_LAYOUT.reduce((a,[p])=>a+(SIZES[p]||0),0)):SIZES[x.p]?' · '+fmtSize(SIZES[x.p]):''}</span><button class="btn ${g==='grp_ai'||x.f.endsWith('.pdf')?'primary':''}" data-dl="${esc(x.p)}" data-name="${esc(x.f)}" ${off?'disabled':''}>${t('dl_btn')}</button></div><div class="status" data-st="${esc(x.p)}"></div></div>`}).join('')}</div></section>`).join('')}`;
}
async function doDownload(btn){
  const st=document.querySelector(`[data-st="${CSS.escape(btn.dataset.dl)}"]`);
  if(!downloads){ st.textContent=t('dl_off'); return; }
  btn.disabled=true; st.textContent=t('dl_busy');
  try{
    let blob; if(btn.dataset.dl==='@zip'){ blob=await buildZip(); } else { const r=await fetch(btn.dataset.dl); if(!r.ok) throw {code:'http_'+r.status}; blob=await r.blob(); }
    await downloads.save({filename:btn.dataset.name, data:blob});
    st.textContent=t('dl_ok');
  }catch(e){ st.textContent = e?.code==='declined' ? t('dl_decl') : t('dl_fail')+(e?.code?` (${e.code})`:''); }
  finally{ btn.disabled=false; }
}

function render(scrollTop){

  if(r==='modules') main.innerHTML=viewModules();

}
